http:
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true

  routers:
    clarity:
      rule: "Host(`clarity.fg.ip-ddns.com`)"
      service: clarity
      tls:
        certResolver: letsencrypt

    pm:
      rule: "Host(`pm.tfsn.dev`)"
      service: pm
      tls:
        certResolver: letsencrypt

  services:
    clarity:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8069"

    pm:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:3000"
