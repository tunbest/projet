http:
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true

  routers:
    jenkins:
      rule: "Host(`jenkins.tfsn.dev`)"
      service: jenkins
      tls:
        certResolver: letsencrypt

    portainer:
      rule: "Host(`portainer.tfsn.dev`)"
      service: portainer
      tls:
        certResolver: letsencrypt

    docker:
      rule: "Host(`docker.fg.ip-ddns.com`)"
      service: docker
      tls:
        certResolver: letsencrypt

    odoo:
      rule: "Host(`odoo.tfsn.dev`)"
      service: odoo
      tls:
        certResolver: letsencrypt

    ssh:
      rule: "Host(`ssh.tfsn.dev`)"
      service: ssh
      tls:
        certResolver: letsencrypt

    clarity:
      rule: "Host(`clarity.tfsn.dev`)"
      service: clarity
      tls:
        certResolver: letsencrypt

  services:
    jenkins:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8082"

    portainer:
      loadBalancer:
        serversTransport: insecureTransport
        servers:
          - url: "https://85.215.215.242:9443"

    docker:
      loadBalancer:
        serversTransport: insecureTransport
        servers:
          - url: "https://85.215.215.242:9443"

    odoo:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8069"

    ssh:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8071"

    clarity:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:3000"
