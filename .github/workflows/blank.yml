name: PostgreSQL16

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on VPS
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF

          mkdir -p /tmp/github-backup

          docker exec ${{ secrets.POSTGRES_CONTAINER }} \
            pg_dump \
            -U ${{ secrets.POSTGRES_USER }} \
            -d ${{ secrets.POSTGRES_DB }} \
            -Fc \
            -f /tmp/backup.dump

          docker cp \
            ${{ secrets.POSTGRES_CONTAINER }}:/tmp/backup.dump \
            /tmp/github-backup/backup.dump

          EOF

      - name: Download backup
        run: |
          mkdir -p backup

          scp \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/github-backup/backup.dump \
            backup/postgres_$(date +%Y%m%d_%H%M%S).dump

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup
          path: backup/*.dump
