name: Deploy Traefik

on:
  workflow_dispatch:

  push:
    paths:
      - dynamic.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Create directory
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /srv/traefik"

      - name: Upload dynamic.yml
        run: |
          scp -i ~/.ssh/id_ed25519 \
            dynamic.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/traefik/dynamic.yml

      - name: Reload Traefik
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          CONTAINER=$(docker ps --format '{{.Names}} {{.Image}}' | grep traefik | awk '{print $1}' | head -1)

          if [ -z "$CONTAINER" ]; then
            echo "Aucun conteneur Traefik trouvé"
            docker ps
            exit 1
          fi

          echo "Traefik trouvé : $CONTAINER"

          docker restart "$CONTAINER"

          docker logs --tail 20 "$CONTAINER"

          EOF
