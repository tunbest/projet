name: Deploy Traefik

on:
  workflow_dispatch:

  push:
    paths:
      - "dynamic.yml"
      - "traefik.yml"
      - "Dockerfile"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -e

          mkdir -p /srv/projet

          cd /srv/projet

          if [ ! -d .git ]; then
            git clone git@github.com:tunbest/projet.git .
          fi

          git fetch origin
          git reset --hard origin/main

          docker rm -f proxy || true

          docker build -t traefik-custom .

          docker run -d \
            --name proxy \
            --restart unless-stopped \
            -p 80:80 \
            -p 443:443 \
            traefik-custom

          docker ps

          EOF
