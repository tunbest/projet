entryPoints:
  web:
    address: ":80"

  websecure:
    address: ":443"

providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@tfsn.dev
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

serversTransport:
  insecureSkipVerify: true

log:
  level: DEBUG
